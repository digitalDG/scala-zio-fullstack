        '409':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - {}
      - apiKeyAuth: []
  /api/todos:
    get:
      tags:
      - todos
      summary: List todos with filtering, sorting and paging
      operationId: getApiTodos
      parameters:
      - name: completed
        in: query
        description: Only completed (true) or only open (false) todos
        required: false
        schema:
          type: boolean
      - name: priority
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Priority'
      - name: tag
        in: query
        description: Only todos with this tag
        required: false
        schema:
          type: string
      - name: q
        in: query
        description: Case-insensitive search in titles
        required: false
        schema:
          type: string
      - name: sort
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/SortField'
      - name: order
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/SortOrder'
      - name: page
        in: query
        required: false
        schema:
          default: 1
          type: integer
          format: int32
          minimum: 1
      - name: pageSize
        in: query
        required: false
        schema:
          default: 20
          type: integer
          format: int32
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoPageResponse'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - {}
      - apiKeyAuth: []
    post:
      tags:
      - todos
      summary: Create a todo
      operationId: postApiTodos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoRequest'
        required: true
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoResponse'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - {}
      - apiKeyAuth: []
  /api/todos/stats:
    get:
      tags:
      - todos
      summary: Counts of total, completed, active and overdue todos
      operationId: getApiTodosStats
      parameters:
      - name: today
        in: query
        description: The client's local date, used to decide what's overdue. Defaults
          to UTC.
        required: false
        schema:
          type: string
          format: date
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoStatsResponse'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - {}
      - apiKeyAuth: []
  /api/tags:
    get:
      tags:
      - todos
      summary: Every tag the user has used, sorted
      operationId: getApiTags
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - {}
      - apiKeyAuth: []
  /api/todos/{id}:
    get:
      tags:
      - todos
      summary: Get one todo
      operationId: getApiTodosId
      parameters:
      - name: id
        in: path
        description: Todo ID
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoResponse'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - {}
      - apiKeyAuth: []
    put:
      tags:
      - todos
      summary: Replace a todo
      operationId: putApiTodosId
      parameters:
      - name: id
        in: path
        description: Todo ID
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoRequest'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoResponse'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - {}
      - apiKeyAuth: []
    delete:
      tags:
      - todos
      summary: Delete a todo
      operationId: deleteApiTodosId
      parameters:
      - name: id
        in: path
        description: Todo ID
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: ''
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - {}
      - apiKeyAuth: []
  /api/todos/{id}/status:
    patch:
      tags:
      - todos
      summary: Mark a todo complete or not complete
      operationId: patchApiTodosIdStatus
      parameters:
      - name: id
        in: path
        description: Todo ID
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoStatusRequest'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoResponse'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - {}
      - apiKeyAuth: []
components:
  schemas:
    ErrorCode:
      title: ErrorCode
      type: string
      enum:
      - validation_failed
      - bad_request
      - unauthorized
      - not_found
      - conflict
      - too_many_requests
      - internal_error
    ErrorResponse:
      title: ErrorResponse
      type: object
      required:
      - code
      - message
      - fieldErrors
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldErrorResponse'
    FieldErrorResponse:
      title: FieldErrorResponse
      type: object
      required:
      - field
      - message
      properties:
        field:
          type: string
        message:
          type: string
    HealthResponse:
      title: HealthResponse
      type: object
      required:
      - status
      - database
      properties:
        status:
          type: string
        database:
          type: string
    LoginRequest:
      title: LoginRequest
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
        password:
          type: string
    Priority:
      title: Priority
      type: string
      enum:
      - low
      - medium
      - high
    RegisterRequest:
      title: RegisterRequest
      type: object
      required:
      - username
      - email
      - password
      properties:
        username:
          type: string
        email:
          type: string
        password:
          type: string
    SortField:
      title: SortField
      default: createdAt
      type: string
      enum:
      - createdAt
      - dueDate
      - priority
      - title
    SortOrder:
      title: SortOrder
      default: desc
      type: string
      enum:
      - asc
      - desc
    TodoPageResponse:
      title: TodoPageResponse
      type: object
      required:
      - items
      - total
      - page
      - pageSize
      - totalPages
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TodoResponse'
        total:
          type: integer
          format: int64
        page:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        totalPages:
          type: integer
          format: int32
    TodoRequest:
      title: TodoRequest
      type: object
      required:
      - title
      - priority
      - completed
      properties:
        title:
          type: string
        description:
          type: string
        priority:
          $ref: '#/components/schemas/Priority'
        dueDate:
          type: string
          format: date
        tags:
          type: array
          items:
            type: string
        completed:
          type: boolean
    TodoResponse:
      title: TodoResponse
      type: object
      required:
      - id
      - title
      - completed
      - priority
      - tags
      - createdAt
      - updatedAt
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
        completed:
          type: boolean
        priority:
          $ref: '#/components/schemas/Priority'
        dueDate:
          type: string
          format: date
        tags:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TodoStatsResponse:
      title: TodoStatsResponse
      type: object
      required:
      - total
      - completed
      - active
      - overdue
      properties:
        total:
          type: integer
          format: int64
        completed:
          type: integer
          format: int64
        active:
          type: integer
          format: int64
        overdue:
          type: integer
          format: int64
    TodoStatusRequest:
      title: TodoStatusRequest
      type: object
      required:
      - completed
      properties:
        completed:
          type: boolean
    UserResponse:
      title: UserResponse
      type: object
      required:
      - id
      - username
      - email
      - createdAt
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        email:
          type: string
        createdAt:
          type: string
          format: date-time
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      description: HttpOnly session cookie set by /api/auth/login
      name: todo_session
      in: cookie
